    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: company_name
        sql: company_name
        type: string

      - name: contact_name
        sql: contact_name
        type: string

      - name: contact_title
        sql: contact_title
        type: string

      - name: contact_email
        sql: contact_email
        type: string

      - name: industry
        sql: industry
        type: string

      - name: hq_location
        sql: hq_location
        type: string

      - name: employee_count
        sql: employee_count
        type: number

      - name: funding_stage
        sql: funding_stage
        type: string

      - name: total_funding_usd
        sql: total_funding_usd
        type: number

      - name: lead_created_at
        sql: lead_created_at
        type: time

      - name: lead_source
        sql: lead_source
        type: string

      - name: lead_status
        sql: lead_status
        type: string

    measures:
      - name: count
        type: count

      - name: total_funding
        sql: total_funding_usd
        type: sum

      - name: avg_employee_count
        sql: employee_count
        type: avg

      - name: hot_leads_count
        type: count
        filters:
          - sql: "{CUBE}.lead_status = 'hot'"

      - name: warm_leads_count
        type: count
        filters:
          - sql: "{CUBE}.lead_status = 'warm'"

      - name: cold_leads_count
        type: count
        filters:
          - sql: "{CUBE}.lead_status = 'cold'"

      - name: inbound_leads_count
        type: count
        filters:
          - sql: "{CUBE}.lead_source = 'inbound'"

      - name: outbound_leads_count
        type: count
        filters:
          - sql: "{CUBE}.lead_source = 'outbound'"
