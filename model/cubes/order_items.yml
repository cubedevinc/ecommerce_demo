cubes:
  - name: order_items
    sql_table: ecommerce.order_items
    description: Order items in the e-commerce platform
    meta:
      domain: Sales
      owner: sales-analytics@example.com
      certified: true
      source_table: sales-engineering-414918.ecommerce.order_items

    joins:
      - name: orders
        sql: "{CUBE.order_id} = {orders.order_id}"
        relationship: many_to_one

      - name: products
        sql: "{CUBE.product_id} = {products.id}"
        relationship: many_to_one

      - name: users
        sql: "{CUBE.user_id} = {users.id}"
        relationship: many_to_one

      - name: inventory_items
        sql: "{CUBE.inventory_item_id} = {inventory_items.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.ID"
        type: number
        primary_key: true

      - name: order_id
        sql: "{CUBE}.ORDER_ID"
        type: number

      - name: user_id
        sql: "{CUBE}.USER_ID"
        type: number

      - name: product_id
        sql: "{CUBE}.PRODUCT_ID"
        type: number

      - name: inventory_item_id
        sql: "{CUBE}.INVENTORY_ITEM_ID"
        type: number

      - name: status
        sql: STATUS
        type: string

      - name: sale_price
        sql: SALE_PRICE
        type: number

      - name: created_at
        sql: CREATED_AT
        type: time

      - name: shipped_at
        sql: SHIPPED_AT
        type: time

      - name: delivered_at
        sql: DELIVERED_AT
        type: time

      - name: returned_at
        sql: RETURNED_AT
        type: time

      - name: is_delivered
        sql: "({CUBE}.DELIVERED_AT IS NOT NULL)"
        type: boolean
        description: "Indicates whether the item has been delivered"

    measures:
      - name: count
        type: count

      - name: order_count
        type: count_distinct
        sql: order_id
        drill_members:
          - orders.num_of_item
          - orders.status

      - name: total_sale_price
        type: sum
        sql: sale_price
        format: currency
        description: "We use this when look at revenue"

      - name: total_revenue_grand_total
        description: "Internal: grand total of sale price across all rows, used for revenue_share calculation"
        multi_stage: true
        sql: "{total_sale_price}"
        type: sum
        group_by: []

      - name: revenue_share
        description: "Each segment's share of total revenue"
        multi_stage: true
        sql: "1.0 * {total_sale_price} / NULLIF({total_revenue_grand_total}, 0)"
        type: number
        format: percent

      - name: average_order_value
        description: "Average revenue per distinct order"
        sql: "{total_sale_price} / NULLIF({order_count}, 0)"
        type: number
        format: currency

      # ---- mero-poc: governed, additive KPIs (pre-aggregation friendly) ----
      - name: revenue
        title: Revenue
        description: "Gross sales value of order lines (sum of sale price), excluding cancelled lines. Certified KPI."
        type: sum
        sql: "CASE WHEN {CUBE}.STATUS <> 'Cancelled' THEN {CUBE}.SALE_PRICE END"
        format: currency
        meta:
          certified: true
          glossary_term: "Revenue"
          ai_context: "Use for any revenue / sales / turnover question. Cancelled lines are already excluded."

      - name: cost_of_goods
        title: Cost of Goods Sold
        description: "Inventory cost of order lines, excluding cancelled lines."
        type: sum
        sql: "CASE WHEN {CUBE}.STATUS <> 'Cancelled' THEN {inventory_items.cost} END"
        format: currency

      - name: gross_margin
        title: Gross Margin
        description: "Revenue minus Cost of Goods Sold."
        type: number
        sql: "{revenue} - {cost_of_goods}"
        format: currency

      - name: gross_margin_pct
        title: Gross Margin %
        description: "Gross Margin as a share of Revenue."
        type: number
        sql: "1.0 * ({revenue} - {cost_of_goods}) / NULLIF({revenue}, 0)"
        format: percent

      - name: units_sold
        title: Units Sold
        description: "Number of order lines that were not cancelled."
        type: count
        filters:
          - sql: "{CUBE}.STATUS <> 'Cancelled'"

      - name: units_returned
        title: Units Returned
        type: count
        filters:
          - sql: "{CUBE}.STATUS = 'Returned'"

      - name: return_rate
        title: Return Rate
        description: "Units Returned divided by Units Sold."
        type: number
        sql: "1.0 * {units_returned} / NULLIF({units_sold}, 0)"
        format: percent

      - name: distinct_orders
        title: Orders
        description: "Distinct orders (approximate distinct count so it can be served from pre-aggregations at any grain)."
        type: count_distinct_approx
        sql: order_id

    pre_aggregations:
      # Lambda: serve history from Cube Store, union live BigQuery rows for the
      # window that is not yet built (near real-time). Must be listed first.
      - name: sales_lambda
        type: rollup_lambda
        union_with_source_data: true
        rollups:
          - CUBE.sales_batch

      # Batch rollup that backs the Power BI "Sales" view.
      - name: sales_batch
        measures:
          - revenue
          - cost_of_goods
          - units_sold
          - units_returned
          - distinct_orders
          - count
        dimensions:
          - status
          - products.department
          - products.category
          - products.brand
          - users.country
          - users.state
          - users.traffic_source
          - distribution_centers.name
        time_dimension: created_at
        granularity: day
        partition_granularity: month
        build_range_start:
          sql: SELECT TIMESTAMP('2019-01-01')
        build_range_end:
          sql: SELECT TIMESTAMP(DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 7 day

      - name: orders_transactions_rollup
        measures:
          - count
        dimensions:
          - status
        time_dimension: created_at
        granularity: day
