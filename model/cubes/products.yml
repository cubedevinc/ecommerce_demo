cubes:
  - name: products
    sql_table: ECOMMERCE.PRODUCTS

    dimensions:
      - name: id
        sql: ID
        type: number
        primary_key: true
       
      - name: brand
        sql: BRAND
        type: string
       
      - name: department
        sql: DEPARTMENT
        type: string
       
      - name: sku
        sql: SKU
        type: string
       
      - name: name
        sql: NAME
        type: string
       
      - name: category
        sql: CATEGORY
        type: string
       
      - name: category_es
        title: "Category (Spanish)"
        description: "Product category translated to Spanish with Snowflake Cortex AI (SNOWFLAKE.CORTEX.TRANSLATE)"
        sql: "SNOWFLAKE.CORTEX.TRANSLATE({category}, 'en', 'es')"
        type: string

      - name: cost
        sql: COST
        type: number
       
      - name: retail_price
        sql: RETAIL_PRICE
        type: number
       
      - name: distribution_center_id
        sql: DISTRIBUTION_CENTER_ID
        type: number
       
    measures:
      - name: count
        type: count
